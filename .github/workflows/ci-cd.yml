name: Meow Fullstack CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to SSH Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.1.7

      - name: Execute Remote Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Set PATH to include Go bin directory
            export PATH=$PATH:/usr/local/go/bin:/home/${{ secrets.SSH_USER }}/go/bin || true

            echo "Stopping systemd services..."
            sudo systemctl stop ${{ vars.BACKEND_ARTIFACT_NAME }} ${{ vars.FRONTEND_ARTIFACT_NAME }} || true

            echo "Navigating to deploy directory and pulling latest code..."
            cd ${{ vars.DEPLOY_DIR }}
            git pull

            echo "Building backend module..."
            cd ${{ vars.DEPLOY_DIR }}/backend
            rm -rf build/* || true
            cp -n .env.example .env || true
            sed -i 's|postgres:postgres|hungg562002:1905|g' .env || true
            go mod download
            swag init -o doc
            go mod tidy
            go build -o build/${{ vars.BACKEND_ARTIFACT_NAME }}

            echo "Building frontend module..."
            cd ${{ vars.DEPLOY_DIR }}/frontend
            rm -rf build/* || true
            cp -n .env.example .env || true
            sed -i 's|http://localhost:8080|https://meow.backend.viiic.net|g' .env || true
            npm install
            npm run build

            echo "Restarting services and reloading Caddy web server..."
            sudo systemctl enable ${{ vars.BACKEND_ARTIFACT_NAME }} ${{ vars.FRONTEND_ARTIFACT_NAME }}
            sudo systemctl restart ${{ vars.BACKEND_ARTIFACT_NAME }} ${{ vars.FRONTEND_ARTIFACT_NAME }}
            sudo systemctl reload caddy

            echo "Deployment finished successfully!"
