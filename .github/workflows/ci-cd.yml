name: Meow Fullstack CI/CD

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo systemctl stop ${{vars.BACKEND_ARTIFACT_NAME}} ${{vars.FRONTEND_ARTIFACT_NAME}} || true
            cd ${{vars.DEPLOY_DIR}}
            git pull
            cd backend
            rm -rf build/* || true
            go get .
            swag init
            go mod tidy
            go build -o build/${{vars.BACKEND_ARTIFACT_NAME}}
            cd ../
            cd frontend
            rm -rf build/* || true
            npm i
            npm run build
            sudo systemctl enable ${{vars.BACKEND_ARTIFACT_NAME}} ${{vars.FRONTEND_ARTIFACT_NAME}}
            sudo systemctl restart ${{vars.BACKEND_ARTIFACT_NAME}} ${{vars.FRONTEND_ARTIFACT_NAME}}
            sudo systemctl reload caddy
