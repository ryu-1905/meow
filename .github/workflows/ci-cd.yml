name: Meow Fullstack CI/CD

on:
  push:
    branches: ["main"]

env:
  DEPLOY_DIR: /home/hungg562002/project/meow

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Build
        run: |
          cd backend
          cp .env.example .env
          go get ./...
          GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o meow-backend .

      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend/meow-backend
          retention-days: 1

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        run: |
          cd frontend
          cp .env.example .env
          npm install
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/build
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: deploy

      - name: Prepare deploy bundle
        run: |
          cp .github/workflows/*.service deploy/
          cp backend/.env.example deploy/backend/.env.example
          cp frontend/.env.example deploy/frontend/.env.example

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/"
          target: "/tmp/meow-deploy"
          overwrite: true

      - name: Setup & Restart Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            D=${{ env.DEPLOY_DIR }}
            S=/tmp/meow-deploy/deploy

            sudo systemctl stop meow-backend meow-frontend || true

            # Backend: ghi đè binary, giữ .env nếu đã có
            cp "$S/backend/meow-backend" "$D/backend/" && chmod +x "$D/backend/meow-backend"
            [ -f "$D/backend/.env" ] || cp "$S/backend/.env.example" "$D/backend/.env"
            sudo cp "$S/meow-backend.service" /etc/systemd/system/

            # Frontend: ghi đè toàn bộ thư mục build/, giữ .env nếu đã có
            rm -rf "$D/frontend/build"
            cp -r "$S/frontend" "$D/frontend/build"
            [ -f "$D/frontend/.env" ] || cp "$S/frontend/.env.example" "$D/frontend/.env"
            sudo cp "$S/meow-frontend.service" /etc/systemd/system/

            # Restart services
            sudo systemctl daemon-reload
            sudo systemctl enable meow-backend meow-frontend
            sudo systemctl restart meow-backend meow-frontend
            sleep 3
            sudo systemctl status meow-backend meow-frontend --no-pager
            rm -rf /tmp/meow-deploy
