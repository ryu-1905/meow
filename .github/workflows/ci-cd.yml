name: Meow Fullstack CI/CD

on:
  push:
    branches: ["main"]

env:
  DEPLOY_DIR: /home/hungg562002/project/meow

jobs:
  build-backend:
    name: Build & Verify Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Build & Smoke Test
        run: |
          cd backend
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init
          go mod tidy
          GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o meow-backend .
          echo "PORT=8080" > .env
          ./meow-backend &
          sleep 3
          curl -f http://localhost:8080/api/health
          kill %1

      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend/meow-backend
          retention-days: 1

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        run: |
          cd frontend
          echo "PUBLIC_BACKEND_URL=https://meow.backend.viiic.net" > .env
          npm install --ignore-engines --legacy-peer-deps
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: |
            frontend/build
            frontend/package.json
            frontend/package-lock.json
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: deploy

      - name: Prepare deploy bundle
        run: cp .github/workflows/*.service deploy/

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/"
          target: "/tmp/meow-deploy"
          overwrite: true

      - name: Setup & Restart Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            D=${{ env.DEPLOY_DIR }}
            S=/tmp/meow-deploy/deploy

            sudo systemctl stop meow-backend meow-frontend || true

            # Backend
            cp "$S/backend/meow-backend" "$D/backend/" && chmod +x "$D/backend/meow-backend"
            [ -f "$D/backend/.env" ] || echo "PORT=8080" > "$D/backend/.env"
            sudo cp "$S/meow-backend.service" /etc/systemd/system/

            # Frontend
            cp -r "$S/frontend/"* "$D/frontend/"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd "$D/frontend"
            [ -f .env ] || printf "PORT=3000\nORIGIN=http://157.7.203.71:3000\n" > .env
            npm install --ignore-engines --legacy-peer-deps --omit=dev
            sudo cp "$S/meow-frontend.service" /etc/systemd/system/
            sudo sed -i "s|/usr/bin/node|$(which node)|g" /etc/systemd/system/meow-frontend.service

            # Restart
            sudo systemctl daemon-reload
            sudo systemctl enable meow-backend meow-frontend
            sudo systemctl restart meow-backend meow-frontend
            sleep 3
            sudo systemctl status meow-backend meow-frontend --no-pager
            rm -rf /tmp/meow-deploy
