name: Meow Fullstack CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build
        run: |
          cd backend
          cp .env.example .env
          go mod tidy
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init
          go build -o ${{vars.BACKEND_ARTIFACT_NAME}} .

      - uses: actions/upload-artifact@v4
        with:
          path: backend/${{vars.BACKEND_ARTIFACT_NAME}}

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Build
        run: |
          cd frontend
          cp .env.example .env
          npm install
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          path: frontend/build

  deploy:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: deploy

      - name: Prepare deploy bundle
        run: |
          cp .github/workflows/*.service deploy/
          cp backend/.env.example deploy/backend/.env.example
          cp frontend/.env.example deploy/frontend/.env.example

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/"
          target: ${{vars.TEMP_DEPLOY_DIR}}
          overwrite: true

      - name: Setup & Restart Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            D=${{ vars.DEPLOY_DIR }}
            S=${{vars.TEMP_DEPLOY_DIR}}

            sudo systemctl stop ${{vars.BACKEND_ARTIFACT_NAME}} ${{vars.FRONTEND_ARTIFACT_NAME}} || true

            # Backend: ghi đè binary, giữ .env nếu đã có
            cp "${{vars.TEMP_DEPLOY_DIR}}/backend/${{vars.BACKEND_ARTIFACT_NAME}}" "${{ vars.DEPLOY_DIR }}/backend/" && chmod +x "${{ vars.DEPLOY_DIR }}/backend/${{vars.BACKEND_ARTIFACT_NAME}}"
            cp -n "${{vars.TEMP_DEPLOY_DIR}}/backend/.env.example" "${{ vars.DEPLOY_DIR }}/backend/.env"
            sudo cp "${{vars.TEMP_DEPLOY_DIR}}/backend/${{vars.BACKEND_ARTIFACT_NAME}}.service" /etc/systemd/system/

            # Frontend: ghi đè toàn bộ thư mục build/, giữ .env nếu đã có
            rm -r "${{ vars.DEPLOY_DIR }}/frontend/build"
            cp -r "${{vars.TEMP_DEPLOY_DIR}}/frontend/build" "${{ vars.DEPLOY_DIR }}/frontend/build"
            cp -n "${{vars.TEMP_DEPLOY_DIR}}/frontend/.env.example" "${{ vars.DEPLOY_DIR }}/frontend/.env"
            sudo cp "${{vars.TEMP_DEPLOY_DIR}}/frontend/${{vars.FRONTEND_ARTIFACT_NAME}}.service" /etc/systemd/system/

            # Restart services
            sudo systemctl daemon-reload
            sudo systemctl enable ${{vars.BACKEND_ARTIFACT_NAME}} ${{vars.FRONTEND_ARTIFACT_NAME}}
            sudo systemctl restart ${{vars.BACKEND_ARTIFACT_NAME}} ${{vars.FRONTEND_ARTIFACT_NAME}}
            sleep 3
            sudo systemctl status ${{vars.BACKEND_ARTIFACT_NAME}} ${{vars.FRONTEND_ARTIFACT_NAME}} --no-pager
            rm -rf ${{vars.TEMP_DEPLOY_DIR}}
